name: gds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  librelane:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài LibreLane
        run: python3 -m pip install --upgrade librelane

      - name: Ghi phiên bản công cụ
        run: |
          python3 -m pip show librelane | head -3 | tee versions.txt
          date -u | tee -a versions.txt

      - name: Chạy LibreLane cho bộ chia I01
        shell: bash
        run: |
          script -qefc "python3 -m librelane --dockerized librelane/config.json" /dev/null | tee librelane.log

      - name: Chạy LibreLane cho bộ nhân đối chứng
        continue-on-error: true
        shell: bash
        run: |
          script -qefc "python3 -m librelane --dockerized librelane/config_mul.json" /dev/null | tee librelane_mul.log

      - name: Liệt kê file GDS
        if: always()
        run: find . -name '*.gds' -not -path './.git/*' || true

      - name: Lưu kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librelane-results
          path: |
            librelane/runs
            versions.txt
            librelane.log
            librelane_mul.log
          if-no-files-found: ignore
