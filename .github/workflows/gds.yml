name: gds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  librelane:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài LibreLane
        run: python3 -m pip install --upgrade librelane

      - name: Chạy LibreLane (Docker) để sinh GDS
        shell: bash
        run: |
          python3 -m librelane --dockerized librelane/config.json 2>&1 | tee librelane.log

      - name: Liệt kê file GDS
        if: always()
        run: find . -name '*.gds' -not -path './.git/*' || true

      - name: Lưu kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librelane-results
          path: |
            librelane/runs
            runs
            librelane.log
          if-no-files-found: ignore
